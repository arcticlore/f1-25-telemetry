[project]
name = "f1telemetry"
version = "0.1.0"
description = "F1 25 UDP telemetry recorder and live dashboard (PySide6)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "f1-telemetry contributors" }]
keywords = ["f1", "f1-25", "telemetry", "udp", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
f1telemetry = "f1telemetry.cli:main"
f1telemetry-gui = "f1telemetry.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
